<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rida Social Wall</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;900&display=swap');
        body { background: transparent; color: #fff; font-family: 'Outfit', sans-serif; margin: 0; padding: 15px; overflow-x: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .admin-glow { border: 1px solid rgba(239, 68, 68, 0.3); box-shadow: 0 0 15px rgba(239, 68, 68, 0.1); }
        .btn-send { background: linear-gradient(135deg, #38bdf8 0%, #6366f1 100%); }
        .slide-up { animation: slideUp 0.5s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="space-y-6">

    <div class="glass rounded-[2.5rem] p-5 relative overflow-hidden border-t border-sky-500/20">
        <div class="flex items-center gap-2 mb-4">
            <div class="w-1.5 h-1.5 rounded-full bg-sky-500 animate-pulse"></div>
            <h3 class="text-[9px] font-black uppercase tracking-[0.2em] text-sky-400">Global Ambassadors</h3>
        </div>
        <div id="ambassador-slider" class="relative h-24">
            </div>
        <div class="flex justify-center gap-1.5 mt-2" id="slider-dots"></div>
    </div>

    <div class="glass p-5 rounded-[2.5rem]">
        <div class="flex items-center gap-3 mb-4">
            <div id="user-avatar" class="w-10 h-10 rounded-full bg-sky-500/20 border border-sky-500/30 flex items-center justify-center font-black text-sky-400 uppercase text-sm">?</div>
            <div>
                <p id="display-name" class="text-xs font-black uppercase text-white">Loading...</p>
                <p id="user-rank" class="text-[8px] opacity-40 font-bold uppercase text-sky-400">Network Node</p>
            </div>
        </div>
        <textarea id="post-text" placeholder="Share network update..." class="w-full bg-white/5 border border-white/10 rounded-2xl p-4 text-xs outline-none focus:border-sky-500/50 transition h-20 resize-none"></textarea>
        <div class="flex justify-end mt-3">
            <button onclick="publishPost()" class="btn-send px-8 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest">Post to Wall</button>
        </div>
    </div>

    <div id="feed-container" class="space-y-4 pb-24"></div>

    <script>
        const SOCIAL_API = "https://script.google.com/macros/s/AKfycbxjIBCavPwdL-F9ym4m0Oz77W-KgIY3JXQ1DcR2fl3HwfZDTT9SxoRARRRzWryEX6lGOQ/exec";
        const ADMIN_UID = "RIDA-259259";
        const params = new URLSearchParams(window.location.search);
        
        const currentUser = {
            uid: params.get('uid') || "GUEST",
            username: params.get('user') || params.get('username') || "Miner-" + Math.floor(Math.random()*999)
        };

        const ambassadors = [
            { country: "China", flag: "🇨🇳", nodes: [{n: "Zying Hu", e: "rga500501@gmail.com"}, {n: "Zen Myng", e: "rga500502@gmail.com"}]},
            { country: "India", flag: "🇮🇳", nodes: [{n: "Rajeve Andrio", e: "rga500503@gmail.com"}, {n: "Tarisvary Balraj", e: "rga500504@gmail.com"}]},
            { country: "Pakistan", flag: "🇵🇰", nodes: [{n: "Muhammad Sohail", e: "rga500505@gmail.com"}, {n: "Mzhar Abbas", e: "rga500506@gmail.com"}]},
            { country: "Nigeria", flag: "🇳🇬", nodes: [{n: "Chidi Okoro", e: "rga500507@gmail.com"}, {n: "Amina Yusuf", e: "rga500508@gmail.com"}]},
            { country: "Indonesia", flag: "🇮🇩", nodes: [{n: "Budi Santoso", e: "rga500509@gmail.com"}, {n: "Siti Aminah", e: "rga500510@gmail.com"}]},
            { country: "UAE", flag: "🇦🇪", nodes: [{n: "Zayed Al-Falahi", e: "rga500511@gmail.com"}, {n: "Omar Rashid", e: "rga500512@gmail.com"}]},
            { country: "Bangladesh", flag: "🇧🇩", nodes: [{n: "Anowar Hossain", e: "rga500513@gmail.com"}, {n: "Farhana Islam", e: "rga500514@gmail.com"}]},
            { country: "UK", flag: "🇬🇧", nodes: [{n: "James Sterling", e: "rga500515@gmail.com"}, {n: "Sarah Jenkins", e: "rga500516@gmail.com"}]}
        ];

        let currentSlide = 0;

        function runSlideshow() {
            const slider = document.getElementById('ambassador-slider');
            const dots = document.getElementById('slider-dots');
            const data = ambassadors[currentSlide];

            slider.innerHTML = `
                <div class="slide-up">
                    <div class="flex items-center gap-3 mb-3">
                        <span class="text-xl">${data.flag}</span>
                        <span class="text-[10px] font-black uppercase tracking-widest text-white">${data.country} Hub</span>
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        ${data.nodes.map(node => `
                            <div class="bg-white/5 p-2 rounded-xl border border-white/5">
                                <p class="text-[9px] font-black text-sky-400 uppercase truncate">${node.n}</p>
                                <p class="text-[7px] text-slate-500 font-medium truncate">${node.e}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            dots.innerHTML = ambassadors.map((_, i) => `<div class="h-1 rounded-full transition-all duration-500 ${i === currentSlide ? 'w-4 bg-sky-500' : 'w-1 bg-white/10'}"></div>`).join('');
            currentSlide = (currentSlide + 1) % ambassadors.length;
        }

        async function loadFeed() {
            try {
                const response = await fetch(SOCIAL_API, { method: 'POST', body: JSON.stringify({ action: 'getFeed' }) });
                const result = await response.json();
                if (result.success) {
                    const container = document.getElementById('feed-container');
                    container.innerHTML = result.data.map(post => {
                        const isMainAdmin = post.uid === ADMIN_UID;
                        const posterName = isMainAdmin ? "ridaAdmin" : (post.username || "Anonymous");
                        return `
                        <div class="glass p-5 rounded-[2rem] ${isMainAdmin ? 'admin-glow' : ''} slide-up">
                            <div class="flex justify-between mb-4">
                                <div class="flex items-center gap-2">
                                    <div class="w-7 h-7 rounded-full bg-white/10 flex items-center justify-center text-[10px] font-black ${isMainAdmin ? 'text-red-500' : 'text-sky-400'}">${posterName.charAt(0)}</div>
                                    <p class="text-[10px] font-black uppercase">${posterName} ${isMainAdmin ? ' <i class="fas fa-check-circle text-red-500 ml-1"></i>' : ''}</p>
                                </div>
                                <div class="flex items-center gap-3">
                                    <p class="text-[8px] opacity-30 font-bold">${new Date(post.timestamp).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}</p>
                                    ${currentUser.uid === ADMIN_UID ? `<i onclick="deletePost('${post.id || post.timestamp}')" class="fas fa-trash-alt text-red-500/20 hover:text-red-500 cursor-pointer text-[10px]"></i>` : ''}
                                </div>
                            </div>
                            <p class="text-xs leading-relaxed text-slate-300">${post.content}</p>
                            <div class="mt-4 flex gap-4 border-t border-white/5 pt-3">
                                <button onclick="interact('like', '${post.id || post.timestamp}')" class="text-[9px] font-bold text-slate-500 hover:text-sky-400"><i class="fas fa-heart mr-1"></i> ${post.likes || 0}</button>
                                <button class="text-[9px] font-bold text-slate-500 hover:text-sky-400"><i class="fas fa-comment mr-1"></i> REPLY</button>
                            </div>
                        </div>`;
                    }).join('');
                }
            } catch (err) { console.error("Sync Error"); }
        }

        async function publishPost() {
            const text = document.getElementById('post-text').value;
            if (!text.trim()) return;
            await fetch(SOCIAL_API, { method: 'POST', body: JSON.stringify({ action: 'createPost', uid: currentUser.uid, username: currentUser.username, content: text }) });
            document.getElementById('post-text').value = '';
            loadFeed();
        }

        async function interact(type, postId) {
            await fetch(SOCIAL_API, { method: 'POST', body: JSON.stringify({ action: type === 'like' ? 'likePost' : 'replyPost', postId: postId, uid: currentUser.uid }) });
            loadFeed();
        }

        async function deletePost(postId) {
            if(!confirm("Delete post?")) return;
            await fetch(SOCIAL_API, { method: 'POST', body: JSON.stringify({ action: 'deletePost', postId: postId, adminUid: currentUser.uid }) });
            loadFeed();
        }

        window.onload = () => {
            document.getElementById('display-name').innerText = currentUser.username;
            document.getElementById('user-avatar').innerText = currentUser.username.charAt(0);
            if(currentUser.uid === ADMIN_UID) {
                document.getElementById('user-rank').innerText = "ADMINISTRATOR";
                document.getElementById('user-rank').classList.add('text-red-500');
            }
            loadFeed();
            runSlideshow();
            setInterval(runSlideshow, 5000); // Ambassador rotation
            setInterval(loadFeed, 30000);   // Live feed sync
        };
    </script>
</body>
</html>
